name: PR AI Quality & Architecture Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-gate:
    name: Autonomous AI Code Review & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run Forensic PR Gate (Deterministic + AI Reviewer)
        id: pr_gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL || 'openrouter/free' }}
        run: |
          uv run python -m orchestrator.analysis.pr_gate
        continue-on-error: true

      - name: Post Autonomous AI Review Comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'pr_review_report.md';
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.find(c => c.body.includes('ORAGAI Autonomous AI Pull Request Reviewer'));
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }

      - name: Enforce Gate Status
        if: steps.pr_gate.outcome != 'success'
        run: |
          echo "❌ Blocking issues detected. Please check the AI Review comment on your PR."
          exit 1
