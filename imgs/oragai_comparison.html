<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORAGAI vs Manual Agent Call</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1680px;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: auto;
            max-height: 94vh;
            display: block;
            border-radius: 16px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
            background: #ffffff;
        }

        /* Typography */
        .font-sans { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .header-main { fill: #0f172a; font-weight: 800; font-size: 32px; letter-spacing: -0.6px; }
        .header-sub { fill: #64748b; font-weight: 500; font-size: 16px; }
        
        .node-text-dark { fill: #0f172a; font-weight: 600; font-size: 13px; }
        .node-text-light { fill: #64748b; font-weight: 500; font-size: 13px; }
        .node-text-sub { fill: #64748b; font-weight: 500; font-size: 11px; }
        
        .tag-text-left { fill: #be123c; font-weight: 600; font-size: 11px; }
        .tag-text-right { fill: #2563eb; font-weight: 600; font-size: 11px; }
        
        .central-stmt-left { fill: #991b1b; font-weight: 800; font-size: 17px; letter-spacing: 1.5px; }
        .central-stmt-right { fill: #1d4ed8; font-weight: 800; font-size: 17px; letter-spacing: 1.5px; }
        
        .bottom-stmt { fill: #475569; font-weight: 600; font-size: 15px; }
        
        .layer-title { fill: #1e293b; font-weight: 700; font-size: 12px; letter-spacing: 1.2px; }
    </style>
</head>
<body>

<div class="container">
<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background Grid -->
        <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#f1f5f9" stroke-width="1" />
        </pattern>

        <!-- Drop Shadows -->
        <filter id="shadow-sm" x="-8%" y="-8%" width="116%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05" />
        </filter>
        <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="125%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
        </filter>

        <!-- Arrow Markers -->
        <marker id="arrow-broken" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
        </marker>
        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
        </marker>
        <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
        </marker>
        <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6" />
        </marker>
        <marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
            <circle cx="5" cy="5" r="3" fill="#3b82f6" />
        </marker>

        <!-- Gradients -->
        <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#94a3b8" stop-opacity="1" />
            <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
        </linearGradient>

        <linearGradient id="right-banner-bg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#eff6ff" />
            <stop offset="100%" stop-color="#f5f3ff" />
        </linearGradient>
    </defs>

    <!-- Global Background -->
    <rect width="1600" height="1000" fill="#ffffff" />
    <rect width="1600" height="1000" fill="url(#grid)" />

    <!-- Center Vertical Divider -->
    <line x1="800" y1="40" x2="800" y2="940" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6" />

    <!-- ========================================================= -->
    <!-- HEADERS                                                   -->
    <!-- ========================================================= -->
    <!-- LEFT HEADER -->
    <g transform="translate(400, 68)" text-anchor="middle">
        <text y="0" class="header-main font-sans">WITHOUT ORAGAI</text>
        <text y="28" class="header-sub font-sans">Fragmented, isolated &amp; redundant execution loops</text>
    </g>

    <!-- RIGHT HEADER -->
    <g transform="translate(1200, 68)" text-anchor="middle">
        <text y="0" class="header-main font-sans" fill="#1e3a8a">WITH ORAGAI</text>
        <text y="28" class="header-sub font-sans">Deterministic, governed &amp; shared multi-agent state</text>
    </g>

    <!-- ========================================================= -->
    <!-- LEFT PANEL: WITHOUT ORAGAI (Fragmented Pipeline)          -->
    <!-- ========================================================= -->
    <g transform="translate(0, 0)">
        <!-- 1. USER TASK -->
        <rect x="270" y="130" width="260" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
        <text x="400" y="156" class="node-text-dark font-sans" text-anchor="middle">USER TASK: Fix Auth Bug</text>

        <!-- 2. Agent starts from scratch -->
        <rect x="270" y="210" width="260" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />
        <text x="400" y="236" class="node-text-light font-sans" text-anchor="middle">Agent starts from scratch</text>

        <!-- 3. Searches repository -->
        <rect x="270" y="285" width="260" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />
        <text x="400" y="311" class="node-text-light font-sans" text-anchor="middle">Searches repository blindly</text>

        <!-- 4. Re-derives architecture -->
        <rect x="270" y="360" width="260" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />
        <text x="400" y="386" class="node-text-light font-sans" text-anchor="middle">Re-derives architecture</text>

        <!-- 5. Reads unrelated files -->
        <rect x="270" y="435" width="260" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />
        <text x="400" y="461" class="node-text-light font-sans" text-anchor="middle">Reads unrelated files</text>

        <!-- 6. Implements -->
        <rect x="270" y="510" width="260" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />
        <text x="400" y="536" class="node-text-light font-sans" text-anchor="middle">Implements without AST guard</text>

        <!-- Central Warning Statement Left -->
        <rect x="190" y="580" width="420" height="40" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1" />
        <text x="400" y="605" class="central-stmt-left font-sans" text-anchor="middle">AGENTS OPERATE IN SILOED ISOLATION</text>

        <!-- 7. Context disappears -->
        <g opacity="0.6">
            <rect x="270" y="650" width="260" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
            <text x="400" y="676" class="node-text-light font-sans" text-anchor="middle">Context discarded at boundary</text>
        </g>

        <!-- 8. Another agent starts cold -->
        <rect x="270" y="730" width="260" height="42" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2" />
        <text x="400" y="756" class="node-text-light font-sans" text-anchor="middle">Next agent starts completely cold</text>

        <!-- 9. Re-tests / retries -->
        <rect x="270" y="810" width="260" height="42" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" />
        <text x="400" y="836" class="node-text-dark font-sans" text-anchor="middle" fill="#9f1239">Test fails &mdash; Unbounded retry loop</text>

        <!-- Flow Arrows (Dashed) -->
        <path d="M 400 172 L 400 205" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-broken)" />
        <path d="M 400 252 L 400 280" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-broken)" />
        <path d="M 400 327 L 400 355" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-broken)" />
        <path d="M 400 402 L 400 430" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-broken)" />
        <path d="M 400 477 L 400 505" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-broken)" />
        <path d="M 400 552 L 400 575" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-broken)" />
        
        <path d="M 400 620 L 400 645" fill="none" stroke="url(#fade-down)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-broken)" />
        <path d="M 400 692 L 400 725" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-broken)" />
        <path d="M 400 772 L 400 805" fill="none" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrow-red)" />

        <!-- Retry Loop Curve -->
        <path d="M 530 831 Q 630 831 630 790 Q 630 751 535 751" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />

        <!-- Telemetry Tags Left -->
        <!-- 1. Cold Start Tag -->
        <rect x="545" y="217" width="105" height="28" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1" />
        <text x="597" y="235" class="tag-text-left font-mono" text-anchor="middle">Cold Start</text>
        <line x1="530" y1="231" x2="545" y2="231" stroke="#fda4af" stroke-width="1" stroke-dasharray="2 2" />

        <!-- 2. Repeated Exploration -->
        <rect x="65" y="292" width="185" height="28" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1" />
        <text x="157" y="310" class="tag-text-left font-mono" text-anchor="middle">Repeated Exploration</text>
        <line x1="250" y1="306" x2="270" y2="306" stroke="#fda4af" stroke-width="1" stroke-dasharray="2 2" />

        <!-- 3. Context Loss -->
        <rect x="545" y="657" width="195" height="28" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1" />
        <text x="642" y="675" class="tag-text-left font-mono" text-anchor="middle">Context Fragmentation</text>
        <line x1="530" y1="671" x2="545" y2="671" stroke="#fda4af" stroke-width="1" stroke-dasharray="2 2" />

        <!-- 4. Manual Handoff -->
        <rect x="85" y="737" width="165" height="28" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1" />
        <text x="167" y="755" class="tag-text-left font-mono" text-anchor="middle">Manual Handoff</text>
        <line x1="250" y1="751" x2="270" y2="751" stroke="#fda4af" stroke-width="1" stroke-dasharray="2 2" />

        <!-- 5. Unbounded Retry -->
        <rect x="645" y="776" width="140" height="28" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="1" />
        <text x="715" y="794" class="tag-text-left font-mono" text-anchor="middle">Unbounded Retry</text>

        <!-- Bottom Left Caption -->
        <text x="400" y="930" class="bottom-stmt font-sans" text-anchor="middle">Same repository &bull; Repeated reasoning &bull; Unbounded costs</text>
    </g>

    <!-- ========================================================= -->
    <!-- RIGHT PANEL: WITH ORAGAI (Governed Control Plane)         -->
    <!-- ========================================================= -->
    <g transform="translate(0, 0)">
        <!-- 1. USER TASK -->
        <rect x="1070" y="130" width="260" height="42" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" filter="url(#shadow-sm)" />
        <text x="1200" y="156" class="node-text-dark font-sans" text-anchor="middle">USER TASK: Fix Auth Bug</text>
        <path d="M 1200 172 L 1200 205" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-solid)" />

        <!-- SECTION 1: ORAGAI CONTROL PLANE CONTAINER -->
        <rect x="835" y="208" width="730" height="116" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="855" y="232" class="layer-title font-mono" text-anchor="start" fill="#1e3a8a">ORAGAI CONTROL PLANE</text>

        <!-- Inner Control Plane Nodes (Horizontal chain) -->
        <!-- Goal Analysis -->
        <rect x="855" y="248" width="155" height="44" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-sm)" />
        <text x="932" y="275" class="node-text-dark font-sans" text-anchor="middle">Goal Analysis</text>

        <!-- Guarded FSM -->
        <rect x="1040" y="248" width="155" height="44" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-sm)" />
        <text x="1117" y="275" class="node-text-dark font-sans" text-anchor="middle">Guarded FSM</text>

        <!-- Context Handoff -->
        <rect x="1225" y="248" width="155" height="44" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow-sm)" />
        <text x="1302" y="275" class="node-text-dark font-sans" text-anchor="middle">Context Spine</text>

        <!-- Token Governor -->
        <rect x="1410" y="248" width="135" height="44" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-sm)" />
        <text x="1477" y="270" class="node-text-dark font-sans" text-anchor="middle" font-size="12">Dynamic</text>
        <text x="1477" y="284" class="node-text-dark font-sans" text-anchor="middle" font-size="12">Token Budget</text>

        <!-- Horizontal Connectors in Control Plane -->
        <path d="M 1010 270 L 1035 270" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-solid)" />
        <path d="M 1195 270 L 1220 270" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-violet)" />
        <path d="M 1380 270 L 1405 270" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-solid)" />

        <!-- Central Highlighting Statement Right -->
        <rect x="915" y="342" width="570" height="40" rx="8" fill="url(#right-banner-bg)" stroke="#bfdbfe" stroke-width="1" />
        <text x="1200" y="367" class="central-stmt-right font-sans" text-anchor="middle">DETERMINISTIC MULTI-AGENT STATE MACHINE</text>

        <!-- SECTION 2: SPECIALIZED AGENTS CONTAINER -->
        <rect x="835" y="402" width="730" height="136" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
        <text x="855" y="426" class="layer-title font-mono" text-anchor="start" fill="#14532d">SPECIALIZED AGENT PERSONAS</text>

        <!-- Orchestration Bus Line -->
        <path d="M 1200 324 L 1200 342" fill="none" stroke="#3b82f6" stroke-width="2" />
        <path d="M 1200 382 L 1200 445" fill="none" stroke="#3b82f6" stroke-width="2" />
        <path d="M 870 445 L 1530 445" fill="none" stroke="#3b82f6" stroke-width="2" />
        
        <!-- 5 Agents Evenly Spaced (Width 125 each, Gap 15) -->
        <!-- Agent 1: Architect -->
        <g transform="translate(855, 455)">
            <line x1="62" y1="-10" x2="62" y2="0" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-solid)" />
            <rect x="0" y="0" width="125" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-md)" />
            <text x="62" y="28" class="node-text-dark font-sans" text-anchor="middle">ARCHITECT</text>
            <text x="62" y="65" class="node-text-sub font-mono" text-anchor="middle">Plan / DAG</text>
        </g>

        <!-- Agent 2: Developer -->
        <g transform="translate(995, 455)">
            <line x1="62" y1="-10" x2="62" y2="0" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-solid)" />
            <rect x="0" y="0" width="125" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-md)" />
            <text x="62" y="28" class="node-text-dark font-sans" text-anchor="middle">DEVELOPER</text>
            <text x="62" y="65" class="node-text-sub font-mono" text-anchor="middle">Implementation</text>
        </g>

        <!-- Agent 3: Tester -->
        <g transform="translate(1135, 455)">
            <line x1="62" y1="-10" x2="62" y2="0" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-solid)" />
            <rect x="0" y="0" width="125" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-md)" />
            <text x="62" y="28" class="node-text-dark font-sans" text-anchor="middle">TESTER</text>
            <text x="62" y="65" class="node-text-sub font-mono" text-anchor="middle">Isolated QA</text>
        </g>

        <!-- Agent 4: Reviewer -->
        <g transform="translate(1275, 455)">
            <line x1="62" y1="-10" x2="62" y2="0" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-solid)" />
            <rect x="0" y="0" width="125" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-md)" />
            <text x="62" y="28" class="node-text-dark font-sans" text-anchor="middle">REVIEWER</text>
            <text x="62" y="65" class="node-text-sub font-mono" text-anchor="middle">Security / Audit</text>
        </g>

        <!-- Agent 5: Auditor -->
        <g transform="translate(1415, 455)">
            <line x1="62" y1="-10" x2="62" y2="0" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-solid)" />
            <rect x="0" y="0" width="125" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-md)" />
            <text x="62" y="28" class="node-text-dark font-sans" text-anchor="middle">AUDITOR</text>
            <text x="62" y="65" class="node-text-sub font-mono" text-anchor="middle">Final Verification</text>
        </g>


        <!-- SECTION 3: CODEBASE INTELLIGENCE -->
        <rect x="835" y="560" width="730" height="114" rx="10" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5" />
        <text x="855" y="584" class="layer-title font-mono" text-anchor="start" fill="#701a75">ZERO-TOKEN CODEBASE INTELLIGENCE</text>

        <g transform="translate(865, 600)">
            <!-- Dependency Graph -->
            <rect x="0" y="0" width="195" height="46" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow-sm)" />
            <text x="97" y="28" class="node-text-dark font-sans" text-anchor="middle">Dependency Graph</text>

            <!-- Call Tree -->
            <rect x="235" y="0" width="195" height="46" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow-sm)" />
            <text x="332" y="28" class="node-text-dark font-sans" text-anchor="middle">AST Call Tree</text>

            <!-- API Skeleton -->
            <rect x="470" y="0" width="195" height="46" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow-sm)" />
            <text x="567" y="28" class="node-text-dark font-sans" text-anchor="middle">API Skeletal Contract</text>

            <!-- Connections -->
            <path d="M 195 23 L 230 23" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-violet)" />
            <path d="M 430 23 L 465 23" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-violet)" />
        </g>

        <!-- Vertical Connectors between layers -->
        <path d="M 1200 538 L 1200 560" fill="none" stroke="#3b82f6" stroke-width="2" marker-start="url(#dot-blue)" />
        <path d="M 1200 674 L 1200 698" fill="none" stroke="#3b82f6" stroke-width="2" marker-start="url(#dot-blue)" />

        <!-- SECTION 4: AST GUARD (Protection Layer) -->
        <rect x="835" y="700" width="730" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="855" y="724" class="layer-title font-mono" text-anchor="start" fill="#0f172a">AST GUARD &bull; VALIDATION &amp; REPAIR PIPELINE</text>

        <g transform="translate(935, 740)">
            <!-- Validate -->
            <rect x="0" y="0" width="155" height="46" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow-sm)" />
            <text x="77" y="28" class="node-text-dark font-sans" text-anchor="middle">01 Syntax Validate</text>

            <!-- Repair -->
            <rect x="185" y="0" width="155" height="46" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-sm)" />
            <text x="262" y="28" class="node-text-dark font-sans" text-anchor="middle" fill="#1d4ed8">02 Auto-Repair</text>

            <!-- Commit -->
            <rect x="370" y="0" width="155" height="46" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow-sm)" />
            <text x="447" y="28" class="node-text-dark font-sans" text-anchor="middle" fill="#047857">03 Verified Commit</text>

            <!-- Connections -->
            <path d="M 155 23 L 180 23" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-broken)" />
            <path d="M 340 23 L 365 23" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-solid)" />
        </g>

        <!-- Bottom Right Caption -->
        <text x="1200" y="930" class="bottom-stmt font-sans" text-anchor="middle">One control plane &bull; Specialized agents &bull; Shared execution context</text>
    </g>

</svg>
</div>

</body>
</html>
